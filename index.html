<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Just to Learn · Content Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6fb;--sf:#fff;--sf2:#f4edf6;--tx:#1b1530;--mu:#5a6b7d;--bd:#e8dcec;--ac:#c8087f;--ac2:#a3086a;--on:#fff;--acs:#fce6f3;--hl:#0aa5d1;--c1:#7a8a9b;--c2:#c27a12;--c3:#c8087f;--c4:#2b7a3d;--c5:#c0392b;--r:12px;--sh:0 1px 2px rgba(18,38,58,.05),0 8px 24px rgba(18,38,58,.05);--font:"Plus Jakarta Sans","Cairo",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a24;--sf:#14232f;--sf2:#1a2d3b;--tx:#e6eef3;--mu:#98aab8;--bd:#273a49;--ac:#f04fae;--ac2:#f77cc4;--on:#06232a;--acs:#3a1630;--hl:#f2b35a;--c1:#8ea0b0;--c2:#e0a84a;--c3:#4cc3cd;--c4:#6cc084;--c5:#ef7b6e;--sh:0 1px 2px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#0e1a24;--sf:#14232f;--sf2:#1a2d3b;--tx:#e6eef3;--mu:#98aab8;--bd:#273a49;--ac:#4cc3cd;--ac2:#7bd6de;--on:#06232a;--acs:#14343b;--hl:#f2b35a;--c1:#8ea0b0;--c2:#e0a84a;--c3:#4cc3cd;--c4:#6cc084;--c5:#ef7b6e;--sh:0 1px 2px rgba(0,0,0,.3)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.55 var(--font)}
h1,h2,h3{font-family:var(--font);font-weight:700;margin:0;letter-spacing:-.01em}
h2{font-size:27px;margin-bottom:4px}
h3{font-size:16px;margin:18px 0 6px}
a{color:var(--ac2)}
.shell{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--sf);border-right:1px solid var(--bd);padding:22px 14px;display:flex;flex-direction:column;gap:22px;overflow:auto}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.brand b{display:block;font-size:17px;line-height:1.15}
.brand small{color:var(--mu);font-size:12px}
.mark{width:38px;height:38px;display:grid;grid-template-columns:1fr 1fr;gap:3px;flex:none}
.mark i{border-radius:6px;background:var(--ac)}.mark i:nth-child(2){background:var(--hl)}.mark i:nth-child(3){background:#2b7a8e}.mark i:nth-child(4){background:var(--tx);opacity:.85}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--mu);padding:10px 12px;border-radius:10px;font:inherit;font-weight:500;cursor:pointer;text-align:left;white-space:nowrap}
nav button::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--bd);flex:none}
nav button:hover{background:var(--sf2);color:var(--tx)}
nav button.on{background:var(--acs);color:var(--ac2);font-weight:700}
nav button.on::before{background:var(--ac)}
main{width:100%;max-width:1120px;margin:0 auto;padding:30px clamp(16px,4vw,44px) 60px}
.sub{color:var(--mu);margin:0 0 20px;max-width:70ch}
button,input,select,textarea{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
textarea{resize:vertical;min-height:90px}
label{display:block;font-size:13px;font-weight:500;color:var(--mu);margin:14px 0 5px}
.btn{border:1px solid var(--bd);background:var(--sf);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:500;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--ac);background:var(--acs)}
.btn.p{background:var(--ac);border-color:var(--ac);color:var(--on);font-weight:600}
.btn.p:hover{background:var(--ac2);border-color:var(--ac2)}
.btn.d{color:var(--c5)}
.btn:focus-visible,nav button:focus-visible,.chip:focus-visible,.row:focus-visible,.aicard:focus-visible,.mode:focus-within{outline:2px solid var(--ac);outline-offset:2px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:13px 15px;background:var(--sf);border:1px solid var(--bd);border-left:4px solid var(--c1);border-radius:var(--r);margin-bottom:9px;cursor:pointer;box-shadow:var(--sh)}
.row small{color:var(--mu)}
.row .mid{flex:1;min-width:0}
.snip{font-size:13px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb{width:58px;height:58px;border-radius:9px;object-fit:cover;flex:none;background:var(--bg)}
.pill{font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:6px;background:var(--sf2);color:var(--mu);margin-right:4px}
.tag.val{background:var(--acs);color:var(--ac2)}.tag.promo{background:#fdebd2;color:#8a5200}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.promo{background:#3d2d12;color:#f2c27b}}
.s-generating{--k:var(--c2)}.s-needs_review{--k:var(--c3)}.s-approved{--k:var(--c4)}.s-rejected{--k:var(--c5)}.s-idea{--k:var(--c1)}.s-new,.s-stopped{--k:var(--c1)}.s-drafted{--k:var(--c3)}.s-sent{--k:var(--c4)}.s-replied{--k:var(--c2)}.s-answered{--k:var(--c4)}
.row,.chip{border-left-color:var(--k,var(--c1))}.pill{color:var(--k,var(--c1))}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.bar b{min-width:150px;text-align:center}
.f{border:1px solid var(--bd);background:var(--sf);border-radius:99px;padding:5px 14px;cursor:pointer;font-size:14px;font-weight:500}
.f:hover{border-color:var(--ac)}
.f.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.wrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(90px,1fr));min-width:640px;gap:1px;background:var(--bd);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.dh{background:var(--sf2);padding:7px;font-size:13px;color:var(--mu);font-weight:600}
.cell{background:var(--sf);min-height:96px;padding:5px}
.cell i{font-style:normal;font-size:12px;color:var(--mu)}
.chip{display:block;margin-top:3px;padding:3px 7px;font-size:12px;background:var(--sf2);border-left:3px solid var(--c1);border-radius:5px;cursor:grab;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
@media(max-width:640px){.g2,.g3{grid-template-columns:1fr}}
.panel{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:22px;box-shadow:var(--sh);margin-bottom:18px}
.panel>h3:first-child{margin-top:0}
dialog{width:min(1100px,96vw);max-height:94vh;overflow:auto;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:18px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,25,38,.5)}
.ed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.pv{position:sticky;top:0}
@media(max-width:860px){.ed{grid-template-columns:1fr}.pv{position:static}}
.card{border:1px solid var(--bd);border-radius:14px;overflow:hidden;background:var(--sf)}
.card .ph{padding:10px 14px;font-size:13px;color:var(--mu);border-bottom:1px solid var(--bd);font-weight:600}
.card img{display:block;width:100%;height:auto;max-height:440px;object-fit:contain;background:var(--bg)}
.card .none{padding:34px 14px;text-align:center;color:var(--mu);background:var(--bg);font-size:13px}
.card .tx{padding:14px;white-space:pre-wrap;word-break:break-word}
.card .tg{padding:0 14px 14px;color:var(--ac2);word-break:break-word}
.more{font-weight:700;color:var(--ac2);cursor:pointer;text-decoration:none}
.hint{font-size:13px;color:var(--mu)}
.warn{color:var(--c5)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
fieldset{border:1px solid var(--bd);border-radius:12px;margin:16px 0 0;padding:6px 16px 16px;background:var(--sf)}
legend{font-size:13px;font-weight:600;color:var(--mu);padding:0 6px}
details{margin-top:12px}summary{cursor:pointer;color:var(--mu);font-weight:500}
.card{position:relative}.card.busy img,.card.busy .none{opacity:.35}.imgload{position:absolute;left:12px;right:12px;top:48px;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 14px;border-radius:10px;background:var(--tx);color:var(--bg);font-weight:600;font-size:14px;z-index:2}.sp{width:16px;height:16px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;flex:none}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.sp{animation:none}}button:disabled{opacity:.55;cursor:not-allowed}
.mode{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--sf);cursor:pointer;margin:8px 0 0;font-size:14px;font-weight:400;color:var(--tx)}
.mode input{width:auto;margin-top:4px}
.mode small{display:block;color:var(--mu);font-size:13px}
.mode.on{border-color:var(--ac);background:var(--acs)}
.chk{display:inline-flex;gap:7px;align-items:center;margin:0 14px 0 0;color:var(--tx);font-size:14px;font-weight:400}
.chk input{width:auto}
.stats{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.stats b{font-size:22px}
.meter{height:10px;border-radius:99px;background:var(--sf2);overflow:hidden;display:flex;min-width:180px;flex:1}
.meter i{display:block;height:100%}.meter .v{background:var(--ac)}.meter .p{background:var(--hl)}
.aigrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:8px}
.aicard{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:16px;cursor:pointer;box-shadow:var(--sh);display:flex;flex-direction:column;gap:8px;transition:border-color .15s,transform .15s}
.aicard:hover{border-color:var(--ac);transform:translateY(-1px)}
.aicard .top{display:flex;align-items:center;gap:11px}
.aicard .top b{display:block;line-height:1.2}
.aicard .top small{color:var(--mu)}
.aicard p{margin:0;font-size:13.5px;color:var(--mu);flex:1}
.aimark{width:38px;height:38px;border-radius:11px;background:var(--acs);color:var(--ac2);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.top .pill{margin-left:auto;font-size:11px}
table.kv{width:100%;border-collapse:collapse;font-size:14px}
table.kv th,table.kv td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
table.kv th{font-size:12px;color:var(--mu);font-weight:600}
table.kv input{padding:7px 9px}
pre.fx{white-space:pre-wrap;font-size:12.5px;background:var(--sf2);border-radius:10px;padding:12px;margin:8px 0 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99;max-width:90vw}
#toast.on{opacity:1}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:column;gap:12px;padding:12px 14px;border-right:0;border-bottom:1px solid var(--bd)}nav{flex-direction:row;overflow-x:auto;padding-bottom:2px}nav button{padding:8px 12px}main{padding-top:20px}}


.pi{display:inline-block;width:20px;height:20px;vertical-align:-5px;flex:none}
.pn{display:inline-flex;align-items:center;gap:7px;font-weight:600;white-space:nowrap}
.aimark .pi{width:38px;height:38px}
.defs{position:absolute;width:0;height:0;overflow:hidden}
table.cl{width:100%;border-collapse:separate;border-spacing:0;background:var(--sf);border:1px solid var(--bd);border-radius:14px;overflow:hidden;font-size:14px;box-shadow:var(--sh);min-width:860px}
table.cl th{background:var(--acs);color:var(--ac2);text-align:left;font-size:13px;padding:11px 12px;font-weight:700;white-space:nowrap}
table.cl td{padding:10px 12px;border-top:1px solid var(--bd);vertical-align:middle}
table.cl tr.clr{cursor:pointer}table.cl tr.clr:hover td{background:var(--sf2)}
table.cl tr.clr:focus-visible{outline:2px solid var(--ac);outline-offset:-2px}
.dt b{display:block;line-height:1.2}.dt small{color:var(--mu);white-space:nowrap}
.vis{width:78px;height:54px;border-radius:8px;object-fit:cover;background:var(--sf2);display:grid;place-items:center;color:var(--mu);font-size:11px;text-align:center;overflow:hidden;line-height:1.15;padding:3px}
.vis.cv{background:var(--ac);color:var(--on);font-weight:700}
.bdg{--k:var(--c1);display:inline-block;padding:3px 12px;border-radius:7px;font-weight:700;font-size:13px;white-space:nowrap;background:color-mix(in srgb,var(--k) 16%,transparent);color:var(--k)}
.k-idea{--k:#6b5bd2}.k-draft{--k:#b7791f}.k-appr{--k:#2a79c9}.k-sched{--k:#2b7a3d}.k-gen{--k:#c27a12}.k-rej{--k:#c0392b}
.q3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media(max-width:900px){.q3{grid-template-columns:1fr}}
.mini{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px;box-shadow:var(--sh)}
.mini h4{margin:0 0 8px;font-size:14px}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:11px;text-align:center}
.mg i{font-style:normal;color:var(--mu);font-weight:600}
.md{min-height:36px;border-radius:7px;padding:2px;background:var(--sf2);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px}
.md.has{background:var(--acs);cursor:pointer;font-weight:700}
.md .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}.md .dots .pi{width:11px;height:11px;vertical-align:0}
.chip .pi{width:14px;height:14px;vertical-align:-3px;margin-right:3px}
.slides{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:8px}
.slimg{width:100%;border-radius:8px;border:1px solid var(--bd);cursor:pointer;display:block;background:var(--sf2);aspect-ratio:4/5}
ul.ck{list-style:none;margin:6px 0 0;padding:0}ul.ck li{padding:3px 0;font-size:14px}ul.ck li.ok{color:var(--c4)}ul.ck li.no{color:var(--c5);font-weight:600}
.df{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.7;padding:10px 12px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;margin:8px 0}
.df del{background:rgba(192,57,43,.22);text-decoration:line-through;border-radius:3px}
.df ins{background:rgba(43,122,61,.26);text-decoration:none;border-radius:3px}
.gap{color:var(--c2,#b7791f);font-size:13px;margin-top:4px}
.ng{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);padding:16px 12px 4px;font-weight:700}
.ng:first-child{padding-top:0}
.stp{display:flex;gap:10px;align-items:center;font-size:17px;margin:26px 0 6px}
.stp .n{width:27px;height:27px;border-radius:50%;background:var(--ac);color:var(--on);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.stp:first-of-type{margin-top:4px}
.adv{margin-top:22px;border:1px dashed var(--bd);border-radius:12px;padding:4px 14px 14px}
.adv>summary{padding:10px 0;color:var(--tx);font-weight:600}
.adv>summary small{color:var(--mu);font-weight:400;margin-left:6px}
.bkpv{width:100%;max-width:360px;border-radius:10px;border:1px solid var(--bd);display:block}
@media(max-width:900px){.ng{display:none}}

/* creative month calendar */
.cal{gap:8px;background:transparent;border:0;border-radius:0;min-width:760px}
.dh{background:transparent;text-align:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:2px 0 4px}
.cell{background:var(--sf2);border:1px solid var(--bd);border-radius:14px;min-height:132px;padding:7px;display:flex;flex-direction:column;gap:6px}
.cell.mt{background:transparent;border-style:dashed;opacity:.45}
.cell.td{border-color:var(--ac);box-shadow:0 0 0 2px var(--acs)}
.cell>i{font-weight:700;font-size:13px;color:inherit;opacity:.75}
.cell.td>i{color:var(--ac);opacity:1}
.pc{display:flex;flex-direction:column;gap:5px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:7px 8px;cursor:grab;box-shadow:0 1px 3px rgba(0,0,0,.08);transition:transform .12s,box-shadow .12s}
.pc:hover,.pc:focus-visible{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.14);outline:0}
.pc-h{display:flex;align-items:center;gap:6px;justify-content:space-between}
.pc-h .pi{width:18px;height:18px}
.pc-t{font-size:12px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc-f{align-self:flex-start;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;color:var(--fc);background:color-mix(in srgb,var(--fc) 14%,transparent)}
.st{font-style:normal;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:rgba(100,116,139,.16);color:#64748b}
.st-sched{background:rgba(22,163,74,.16);color:#16a34a}.st-appr{background:rgba(14,124,134,.16);color:#0e7c86}
.st-draft{background:rgba(245,158,11,.18);color:#d97706}.st-gen{background:rgba(124,58,237,.16);color:#7c3aed}
.st-rej{background:rgba(220,38,38,.14);color:#dc2626}
.camp{border-left:4px solid var(--ac)}.camp-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:16px}
.camp-w{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.camp-wk{display:flex;flex-direction:column;gap:3px;padding:8px 10px;border:1px solid var(--bd);border-top:3px solid var(--fc);border-radius:10px;background:var(--sf2);font-size:13px}
.camp-wk .st{color:var(--fc);background:color-mix(in srgb,var(--fc) 14%,transparent)}
.camp-nl{margin-top:10px;padding:10px 12px;border:1px dashed var(--bd);border-radius:10px;font-size:13px}


.srcs{margin:10px 0 4px;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--sf2);font-size:13px}
.srow{display:flex;gap:10px;align-items:flex-start;padding:5px 0;border-top:1px solid var(--bd)}.srow:first-of-type{border-top:0;margin-top:6px}
.sb{flex:none;max-width:44%;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:normal;line-height:1.3}
.sb-k{background:rgba(14,124,134,.15);color:#0e7c86}.sb-a{background:rgba(242,163,58,.2);color:#b86e00}.sb-r{background:rgba(37,99,235,.14);color:#2563eb}.sb-u{background:rgba(100,116,139,.18);color:#64748b}
.stx{line-height:1.4}
.st-pub{background:rgba(22,163,74,.2);color:#15803d}
.rv{padding:8px 0;border-top:1px solid var(--bd)}.rv:first-of-type{border-top:0;margin-top:6px}.rvn{font-weight:600;background:rgba(22,163,74,.16);padding:2px 8px;border-radius:8px;display:inline-block}.rvc{font-weight:600;background:rgba(242,163,58,.2);padding:2px 8px;border-radius:8px;display:inline-block;margin-bottom:4px}.rv .acts{display:flex;gap:8px;margin-top:6px}.rv .btn{padding:5px 12px;font-size:12px}
.fut{width:100%;border-collapse:collapse;font-size:14px;background:var(--sf)}.fut th{text-align:left;color:var(--mu);font-weight:600;padding:9px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}.fut td{padding:9px 8px;border-bottom:1px solid var(--bd);vertical-align:top}.fut tr.od td:first-child{border-left:3px solid var(--c5)}
.scg{display:grid;grid-template-columns:repeat(7,minmax(104px,1fr));min-width:740px;gap:1px;background:var(--bd);border:1px solid var(--bd);border-radius:12px;overflow:hidden}.sch{background:var(--sf2);padding:6px 8px;font-size:12px;font-weight:600;color:var(--mu)}
.scd{background:var(--sf);min-height:96px;padding:5px 6px}.scd.off{opacity:.45}.scd.wk{background:var(--sf2)}.scd.td{outline:2px solid var(--ac);outline-offset:-2px}.scn{font-size:12px;font-weight:600;color:var(--mu);margin-bottom:3px}.scc{background:var(--ac);color:var(--on);border-radius:99px;padding:0 7px;font-size:11px}.scc.over{background:var(--c5)}
.scch{display:block;margin-top:3px;padding:3px 7px;font-size:12px;background:var(--sf2);border-left:3px solid var(--c3);border-radius:5px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.scch.p{cursor:grab}.scch.d{border-left-color:var(--c4);color:var(--mu)}.scch.r{border-left-color:var(--c2);color:var(--mu)}fieldset .scch{display:inline-block;margin:3px 4px 0 0}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}.rcard{background:var(--sf2);border-radius:12px;padding:12px 14px}.rcard b{display:block;font-size:24px}.rcard small{color:var(--mu)}
#auth{width:min(420px,94vw)}
.chk{display:flex;gap:8px;align-items:center;margin:6px 0;font-weight:400}.btn.p{background:linear-gradient(135deg,#ec018e,#92278f);border-color:transparent;color:#fff}.side{border-top:4px solid #ec018e;border-image:linear-gradient(90deg,#ec018e,#92278f) 1}.tw label.chk{display:inline-flex;gap:6px;align-items:center;margin-right:14px}

function imgBusy(on,msg){const c=document.querySelector("#ed .card");let o=$("#imgload");

function upl(i){const f=i.files[0];if(!f)return;collect();const m=new Image();m.onload=async()=>{const k=Math.min(1,1024/Math.max(m.width,m.height)),c=document.createElement("canvas");c.width=m.width*k;c.height=m.height*k;c.getContext("2d").drawImage(m,0,0,c.width,c.height);const raw=c.toDataURL("image/jpeg",.82);sel.imgRaw=raw;sel.img=await stampIf(raw);sel.meta.logo=sel.img!==raw;edit(sel.id)};m.src=URL.createObjectURL(f)}

async function act(s){if(sel.status==="generating"){if(confirm("This post is still marked as Writing…\nIf it has been more than a few minutes it is probably stuck.\n\nReset it so you can edit, approve or reject it?"))return resetStuck();$("#ed").close();return}await needWho();if(s==="approved"){const un=revOpen(sel);if(un>0&&!confirm("The AI reviewer found or changed "+un+" claim(s) that you have not checked. Approve anyway?"))return}if(sel.status==="idea"&&s!=="rejected")s="idea";collect();let chg="";if(sel.base&&sel.base.text&&(sel.base.text!==sel.text||sel.base.tags!==sel.tags)){const d=diffCount(sel.base.text,sel.text);histPush(sel,sel.base.text,sel.base.tags,"Edited by hand");chg=" · +"+d[0]+" / −"+d[1]+" words"}sel.status=s;sel.meta=sel.meta||{};if(s==="approved")sel.meta.pub={state:"ready",by:who(),at:new Date().toISOString()};else delete sel.meta.pub;try{await save(sel);sel.base=null;logAct(s==="approved"?"approved → ready to publish":s==="rejected"?"rejected":"edited",sel.id,ttl(sel)+chg);$("#ed").close();render();toast(s==="approved"?"Approved. It is now ready to publish":s==="rejected"?"Rejected":"Saved")}catch(e){fail(e)}}
async function regen(){if(sel.status==="generating"){if(confirm("This post is still marked as Writing…\nReset it if it is stuck?"))return resetStuck();return}await needWho();if(!sel.text&&!sel.src&&sel.status!=="idea")return toast("Nothing to rewrite yet. Attach a file first");
collect();const c=v("#cm");
if(sel.base&&sel.base.text&&sel.base.text!==sel.text)histPush(sel,sel.base.text,sel.base.tags,"Before your edits");if(sel.text)histPush(sel,sel.text,sel.tags,"Before an AI rewrite"+(c?": "+c.slice(0,60):""));
sel.note=[c||(sel.src?"Write the post from the source material below.":""),sel.src?srcLine(sel.src):""].filter(Boolean).join("\n\n");
sel.status="generating";try{await api("post-regenerate",toRow(sel));logAct("rewrite",sel.id,ttl(sel));sel.src=null;$("#ed").close();await load();render();toast("Rewriting…")}catch(e){fail(e)}}

async function knSeed(){const S=[["~Company Overview (Just to Learn and NEOMI)","Just to Learn (J2L), tagline: nothing but creativity. Flagship product: NEOMI, an AI and immersive STEAM studio that helps schools assess and develop students' creativity so learners thrive confidently in the AI era. Two ways we work with a school: the AI-Based Creative Thinking Test and the NEOMI Creativity Program. NEOMI also serves companies (hiring and team assessment) and governments and ministries of education (national creativity assessment). Contact: ahmed.morsy@justtolearn.com, www.justtolearn.com."],["~AI-Based Creative Thinking Test: for schools","AI-Based Creative Thinking Test. Know who is creative, before you enroll them and after. Admissions advantage: score applicants on creative thinking alongside academics. School-wide diagnostic: find the most creative students and those needing support, class by class. Curriculum insight: use the data to guide teaching methods, content and activities. Features: affordable, instant results (Rapid Test), detailed report beyond the core skills (mindfulness, emotions, imagination, linguistic and visual thinking). Value: smarter enrollment decisions, data-driven curriculum development, reputation for future-ready learners, reducing creativity loss."],["~AI-Based Creative Thinking Test: for companies","NEOMI Creative Thinking Test for companies and HR leaders. Hire and grow the creativity AI cannot replace. Hiring and selection: score candidates' creative thinking next to technical tests, compare applicants on the same objective measure, add evidence to interviews. Team assessment and growth: map creative strengths across teams, spot innovation champions, measure training impact with before-and-after scores. Measures fluency, flexibility, originality, elaboration and imagination. AI-scored, instant results, individual and team reports. Offer: pilot with one team or one hiring round; we set it up, run it and walk you through the results."], f education tomorrow. Creativity is the one skill AI cannot replace and the one skill parents want their children to master."],["~What schools need","The edge for your school: attract and retain top talent, deliver measurable creativity outcomes, position the school as a leader in future-ready education. Every semester lost means creativity slipping away."],["~Statistics and Trends","57% of employers call creative thinking a core skill (WEF Future of Jobs, 2025). 39% of workers' core skills are expected to change by 2030 (WEF, 2025). 67% of the most creative companies beat average organic revenue growth (McKinsey, 2017). 3.1% of world GDP comes from the creative economy (UNCTAD, 2024). 84% of high-school students already use AI for schoolwork, US (College Board, 2025). Saudi Arabia scores 23 vs the OECD average of 33 in PISA creative thinking (OECD, 2024)."]];;const have=kn.map(k=>k.title.toLowerCase());let n=0;for(const[t,c]of S){if(have.includes((t[0]=="~"?t.slice(1):"Product: "+t).toLowerCase()))continue;try{await knSave({id:null,title:(t[0]=="~"?t.slice(1):"Product: "+t),content:c,scope:"all",status:"active",verified:"true"});n++}catch(e){fail(e);break}}await loadKn();toast(n?n+" products added. Edit them to add more detail":"They are already there")}

/* weekly rhythm: N posts a week, some of them carousels */
function rhythm(it,mon,skip,per,car){const[y,m]=mon.split("-").map(Number),t=new Date();t.setHours(0,0,0,0);const wk={};
for(let d=1;d<=new Date(y,m,0).getDate();d++){const x=new Date(y,m-1,d);if(x<=t||(skip&&(x.getDay()===5||x.getDay()===6)))continue;const k=dstr(wkStart(x));(wk[k]=wk[k]||[]).push(x)}
const slots=[];Object.keys(wk).sort().forEach(k=>{const ds=wk[k],n=Math.min(per,ds.length),pk=[];for(let i=0;i<n;i++)pk.push(ds[n===1?0:Math.round(i*(ds.length-1)/(n-1))]);const step=car>0?Math.max(1,Math.round(n/car)):0;pk.forEach((x,j)=>slots.push({date:dstr(x),car:car>0&&j%step===0&&Math.floor(j/step)<car}))});
return it.map((o,k)=>{const sl=slots[k];if(!sl)return{...o};const can=["LinkedIn","Instagram","Facebook"].includes(o.platform);return{...o,date:sl.date,format:o.format||(sl.car&&can?"Carousel":"")}})}

/* ---------- change history: see what changed, and go back ---------- */
const tokz=t=>String(t||"").split(/(\s+)/).filter(x=>x!=="");
function diffW(a,b){const A=tokz(a),B=tokz(b),n=A.length,m=B.length;if(n*m>1500000)return[[-1,String(a)],[1,String(b)]];
const W=m+1,T=new Uint16Array((n+1)*W);for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)T[i*W+j]=A[i]===B[j]?T[(i+1)*W+j+1]+1:Math.max(T[(i+1)*W+j],T[i*W+j+1]);
const out=[],push=(t,x)=>{const l=out[out.length-1];if(l&&l[0]===t)l[1]+=x;else out.push([t,x])};let i=0,j=0;
while(i<n&&j<m){if(A[i]===B[j]){push(0,A[i]);i++;j++}else if(T[(i+1)*W+j]>=T[i*W+j+1]){push(-1,A[i]);i++}else{push(1,B[j]);j++}}
while(i<n)push(-1,A[i++]);while(j<m)push(1,B[j++]);return out}
const diffH=(a,b)=>diffW(a,b).map(([t,x])=>t===0?esc(x):t<0?`<del>${esc(x)}</del>`:`<ins>${esc(x)}</ins>`).join("");
const diffCount=(a,b)=>{let p=0,m=0;diffW(a,b).forEach(([t,x])=>{const n=(x.match(/\S+/g)||[]).length;if(t>0)p+=n;else if(t<0)m+=n});return[p,m]};

function lselMode(){LSELM=!LSELM;if(!LSELM)LSEL.clear();render()}

async function delLeads(ids,quiet){ids=[...new Set(ids)];if(!ids.length)return 0;if(!quiet&&!confirm("Delete "+ids.length+(ids.length===1?" lead":" leads")+" for good? Their emails and notes go too. This cannot be undone."))return 0;
let gone=0,skipped=0,why="";try{for(let i=0;i<ids.length;i+=300){const x=one(await api("leads-delete",{ids:ids.slice(i,i+300)}));if(!x||x.ok===false)throw new Error((x&&x.error)||"Could not delete");gone+=x.deleted||0;skipped+=x.skipped||0;if(x.why&&x.why[0])why=x.why[0]}
LSEL.clear();LSELM=false;await loadLeads();const left=leads.filter(l=>ids.includes(l.id)).length;if(left)alert("n8n answered, but "+left+" of the "+ids.length+" leads are still in the table.\nOpen n8n, open the workflow, check the node “Delete lead rows” in the last execution of leads-delete, and send me the error you see.\nMeanwhile you can delete the rows directly in n8n: Data tables, leads, select rows, Delete.");else toast(gone+" deleted"+(skipped?", "+skipped+" skipped"+(why?". "+why:""):""));return gone}catch(e){if(/leads-delete (404|0)|Failed to fetch/.test(String(e.message)))alert("The delete step is not in your n8n yet.\nImport Content_Studio_API_Engine_sales_v24.json in n8n and activate it, then try again.");else fail(e);await loadLeads();return gone}}
async function leadDelete(){const l=lsel;if(!l)return;if(!confirm("Delete "+(l.name||l.email)+" for good? Their emails and notes go too. This cannot be undone."))return;const n=await delLeads([l.id],true);if(n){$("#ed").close();render()}}
async function clearDraft(k){lcollect();if(!confirm(k==="first"?"Delete the first email (subject and message)?":"Delete this draft?"))return;
if(k==="first"){lsel.subject="";lsel.body="";if(lsel.status==="drafted")lsel.status="new"}else lsel.draft="";try{await upd(lsel);editLead(lsel.id);toast("Deleted");render()}catch(e){fail(e)}}
async function bcDel(id){const c=COMP.find(x=>x.id===id);if(!confirm("Delete the battle card for "+(c?c.name:"this competitor")+"?"))return;try{await api("card-delete",{competitor_id:id});BC=BC.filter(b=>String(b.competitor_id)!==String(id));toast("Deleted");render()}catch(e){fail(e)}}
/* duplicates: same email (or same phone). Keep the lead that is furthest along. */
function dupGroups(){const rank=l=>["new","drafted","quiet","sent","replied","answered","visit","trial","contract"].indexOf(l.status)*10+(l.sent?5:0)+(l.reply?5:0)+(l.thread?3:0),by=new Map();
for(const l of leads){const e=lsig(l),p=String(l.phone||"").replace(/\D/g,"").slice(-9),nm=(String(l.name||"")+"|"+String(l.company||"")).toLowerCase().replace(/\s+/g," ").trim(),k=e?"e:"+e:(p.length>=8?"p:"+p:(nm.length>3?"n:"+nm:""));if(!k)continue;(by.get(k)||by.set(k,[]).get(k)).push(l)}
return [...by.entries()].filter(([k,a])=>a.length>1).map(([k,a])=>{a.sort((x,y)=>rank(y)-rank(x)||x.id-y.id);return{key:k.slice(2),keep:a[0],extra:a.slice(1)}})}
async function dupClean(){const G=dupGroups();if(!G.length)return toast("No duplicates found");const ids=G.flatMap(g=>g.extra.map(l=>l.id));
const eg=G.slice(0,4).map(g=>g.key+" ("+(g.extra.length+1)+" copies)").join(", ");
if(!confirm("Found "+ids.length+" extra copies of "+G.length+" contacts.\n"+eg+(G.length>4?", …":"")+"\n\nKeep one copy of each (the one furthest along) and delete the "+ids.length+" extra copies?"))return;await delLeads(ids,true)}
/* safer import: clean the rows before they are sent, and show what will happen */
function impCheck(O){const have=new Set([...leads,...OTH].map(l=>String(l.email||"").toLowerCase()).filter(Boolean)),seen=new Set(),out=[],noE=[];let inFile=0,exist=0,empty=0;
for(const o of O){const e=String(o.email||"").trim().toLowerCase(),ph=String(o.phone||"").replace(/\D/g,"").slice(-9);
if(!e||!EMAIL_OK(e)){if(ph.length>=7&&(o.name||o.company))noE.push(o);else empty++;continue}
if(have.has(e)){exist++;continue}
if(seen.has(e)){inFile++;continue}seen.add(e);out.push(o)}
let ne=0;
if(noE.length&&confirm(noE.length+" rows have NO email (only a phone number).\n\nOK = add them too, as phone-only leads\nCancel = skip them (recommended)")){const sp=new Set([...leads].map(l=>String(l.phone||"").replace(/\D/g,"").slice(-9)).filter(x=>x.length>=7));for(const o of noE){const ph=String(o.phone||"").replace(/\D/g,"").slice(-9);if(sp.has(ph)||seen.has("p"+ph)){inFile++;continue}seen.add("p"+ph);out.push(o);ne++}}
const skippedNoE=noE.length-ne;
if(!out.length){alert("Nothing new to add.\n\nAlready in your leads: "+exist+"\nRepeated inside the file: "+inFile+"\nNo email (skipped): "+(skippedNoE+empty));return null}
if(!confirm("This file has "+O.length+" rows.\n\nWill be added: "+out.length+(ne?" (including "+ne+" without email)":"")+"\nAlready in your leads: "+exist+"\nRepeated inside the file: "+inFile+"\nNo email, skipped: "+(skippedNoE+empty)+"\n\nContinue?"))return null;return out}
